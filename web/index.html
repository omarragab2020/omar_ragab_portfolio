<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Omar Ragab - Flutter Developer Portfolio">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Omar Ragab">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=3"/>
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=3"/>

  <title>Omar Ragab | Flutter Developer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #0B0F19;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #loading-indicator {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-color: #0B0F19;
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      transition: opacity 0.4s ease-out;
    }
    .avatar-loader {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 3px solid #00F0FF;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
      object-fit: cover;
      margin-bottom: 20px;
      animation: pulse 1.5s ease-in-out infinite alternate;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(0, 240, 255, 0.15);
      border-top: 3px solid #00F0FF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 10px rgba(0, 240, 255, 0.3); }
      100% { transform: scale(1.05); box-shadow: 0 0 25px rgba(0, 240, 255, 0.6); }
    }
  </style>
</head>
<body>
  <div id="loading-indicator">
    <img class="avatar-loader" src="favicon.png?v=3" alt="Omar Ragab">
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loading-indicator');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 400);
      }
    });
  </script>
</body>
</html>
