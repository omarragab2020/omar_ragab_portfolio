name: omar_ragab_portfolio
description: "Omar Ragab - Creative Flutter Developer Portfolio Web & Mobile"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  font_awesome_flutter: ^11.0.0
  url_launcher: ^6.3.2
  animated_text_kit: ^4.3.0
  flutter_animate: ^4.5.2
  flutter_staggered_animations: ^1.1.1
  provider: ^6.1.5+1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/projects/
    - assets/images/
